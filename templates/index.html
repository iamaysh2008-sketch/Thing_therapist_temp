<!DOCTYPE html>
<html>

<head>
    <title>THING THERAPIST 🔮</title>
</head>

<body>

    <h1>🔮THING THERAPIST</h1>

    <p>Because even objects need life advice.</p>

    <h2>Upload an object that needs advice 📸</h2>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Give Advice
        </button>

    </form>

    {% if result %}

        <h2>{{ result }}</h2>

    {% endif %}

</body>

</html>
