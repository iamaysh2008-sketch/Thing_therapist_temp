<!DOCTYPE html>
<html>

<head>
    <title>Object Adviser 🔮</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            padding: 40px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
        }

        #preview {
            display: none;
            max-width: 300px;
            max-height: 300px;
            margin: 20px auto;
            border-radius: 15px;
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background-color: #eeeeee;
            border-radius: 15px;
        }

        #loading {
            display: none;
            margin-top: 20px;
        }

    </style>

</head>


<body>

    <div class="container">

        <a href="/">← Back to Home</a>

        <h1>🔮 Object Adviser</h1>

        <p>
            Upload an object and give it the emotional support
            it definitely did not ask for. 😭
        </p>


        <form
            method="POST"
            enctype="multipart/form-data"
            onsubmit="showLoading()"
        >

            <h2>Choose your object 📸</h2>

            <input
                type="file"
                name="image"
                accept="image/*"
                required
                onchange="previewImage(event)"
            >

            <br>

            <img id="preview">

            <br>

            <button type="submit">
                🔮 Give My Object Advice
            </button>

        </form>


        <p id="loading">
            🔮 Consulting the Object Oracle... Please wait 😭
        </p>


        {% if result %}

        <div class="result">

            <h2>🤖 Object Therapy Session</h2>

            <p style="white-space: pre-line;">
                {{ result }}
            </p>

        </div>

        {% endif %}

    </div>


    <script>

        function previewImage(event) {

            const preview = document.getElementById("preview");

            const file = event.target.files[0];

            if (file) {

                preview.src = URL.createObjectURL(file);

                preview.style.display = "block";

            }

        }


        function showLoading() {

            document.getElementById("loading").style.display = "block";

        }

    </script>

</body>

</html>
